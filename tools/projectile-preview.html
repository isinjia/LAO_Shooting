<!doctype html><html lang="ko"><meta charset="utf-8"><title>캐릭터 투사체 · Three.js</title>
<style>body{margin:0;background:#0c1320;color:#d9e6fa;font:15px system-ui}header{max-width:960px;margin:24px auto 14px;display:flex;justify-content:space-between;align-items:center}button{background:#203450;border:1px solid #55749a;color:inherit;padding:9px 18px;border-radius:6px;margin-left:8px;cursor:pointer}button.active{background:#365c87}#stage{position:relative;width:min(100vw,960px);aspect-ratio:16/9;margin:auto}canvas{width:100%;height:100%;display:block}p{max-width:960px;margin:16px auto;color:#8fa7c5}</style>
<header><strong>캐릭터별 투사체 · Three.js</strong><nav><button data-mode="0" class="active">일반탄</button><button data-mode="1">차지샷</button><button data-mode="2">특수탄</button></nav></header>
<div id="stage"><canvas width="960" height="540"></canvas></div><p>불꽃 흐름 · 실탄 궤적 · 다층 참격 · 추진탄 · 테슬라 방전 / 오른쪽 표적에서 명중 효과를 확인할 수 있습니다.</p>
<script type="module">
import {ProjectileVfx} from '../js/projectile-vfx.js';
import {Bullet} from '../js/bullet.js';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),fx=new ProjectileVfx(canvas);
const profiles=[['히루메','foxflame','#ffd56a',4.5],['콘스탄챠','tracer','#ffe0a0',2.6],['LRL','cleave','#e81e2b',8.5],['멀린','shell','#e63946',4],['파프니르','lightning','#7cf5ff',4]];
let mode=0,time=0,last=performance.now(),acc=1,shots=[];
document.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{mode=Number(btn.dataset.mode);shots=[];acc=1;document.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b===btn));});
window.addEventListener('resize',()=>fx.resize());
function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;time+=dt;acc+=dt;
 ctx.fillStyle='#101725';ctx.fillRect(0,0,960,540);
 if(acc>.36){acc=0;profiles.forEach(([name,style,color,r],i)=>shots.push(new Bullet({x:210,y:62+i*105,vx:430,vy:0,r:mode===1?8:mode===2?5.5:r,friendly:true,style,color,pierce:mode===1,special:mode===2})));}
 profiles.forEach(([name,style,color],i)=>{const y=62+i*105;ctx.fillStyle='#172439';ctx.fillRect(14,y-43,932,88);ctx.fillStyle='#d9e6fa';ctx.font='16px system-ui';ctx.fillText(name,30,y+5);ctx.strokeStyle='#3b526d';ctx.beginPath();ctx.arc(860,y,15,0,Math.PI*2);ctx.stroke();});
 for(const b of shots){b.update(dt);if(b.x>=855){fx.impact(b);b.alive=false;}if(!fx.active&&b.alive)b.draw(ctx);}shots=shots.filter(b=>b.alive);fx.render(shots,time);requestAnimationFrame(frame);}
requestAnimationFrame(frame);window.addEventListener('pagehide',()=>fx.dispose());
</script></html>
